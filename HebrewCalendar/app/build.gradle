plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.myappstore.hebrewcalendar'
    compileSdk 34

    defaultConfig {
        applicationId "com.myappstore.hebrewcalendar"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Reference implementation the Hebrew date arithmetic is checked against.
    testImplementation 'com.ibm.icu:icu4j:75.1'
}
