name: SmsForwarder screenshots (temporary)

on:
  push:
    branches: [ ccr-360c86fd-9td1w7 ]
    paths:
      - 'SmsForwarder/**'
      - '.github/workflows/sms-forwarder-screenshots.yml'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and screenshots
        working-directory: SmsForwarder
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon

      # Screenshots go to a hidden ref (not a branch) so they can be fetched with git.
      - name: Publish screenshots
        if: always()
        working-directory: SmsForwarder/app/build
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p screenshots
          cp -r test-results screenshots/ 2>/dev/null || true
          cd screenshots
          git init -q .
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots $GITHUB_SHA"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/screenshots/sms-forwarder
