name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - dir: AgoraApp
            artifact: AgoraApp-debug-apk
          - dir: ClaudeCameraLauncher
            artifact: ClaudeCameraLauncher-debug-apk
          - dir: Yad2App
            artifact: Yad2App-debug-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ matrix.app.dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ matrix.app.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.dir }}/app/build/outputs/apk/debug/*.apk
