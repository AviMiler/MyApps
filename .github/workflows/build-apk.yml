name: Build APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# contents: write lets the release steps attach APKs to a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One app's flaky download must not cancel the other apps' builds.
      fail-fast: false
      matrix:
        app:
          - dir: AgoraApp
            artifact: AgoraApp-debug-apk
          - dir: AlarmClock
            artifact: AlarmClock-debug-apk
          - dir: ClaudeCameraLauncher
            artifact: ClaudeCameraLauncher-debug-apk
          - dir: HebrewCalendar
            artifact: HebrewCalendar-debug-apk
            # Also published to a fixed Release so the APK has a direct download
            # link that works on a phone (Actions artifacts need a desktop login).
            release_tag: hebrew-calendar-latest
          - dir: SmsForwarder
            artifact: SmsForwarder-debug-apk
          - dir: Yad2App
            artifact: Yad2App-debug-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: ${{ matrix.app.dir }}
        run: chmod +x gradlew

      - name: Unit tests
        if: matrix.app.dir == 'SmsForwarder' || matrix.app.dir == 'HebrewCalendar'
        working-directory: ${{ matrix.app.dir }}
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: ${{ matrix.app.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Name APK for the Release
        if: matrix.app.release_tag && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp ${{ matrix.app.dir }}/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.app.dir }}.apk

      - name: Upload APK to Release
        if: matrix.app.release_tag && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ matrix.app.dir }} (latest build)
          body: |
            Latest debug build of ${{ matrix.app.dir }} from commit ${{ github.sha }}.
            Download ${{ matrix.app.dir }}.apk below and install it on the phone.
          files: ${{ matrix.app.dir }}.apk

  # A manual run also publishes SmsForwarder as a release asset, so there is a direct link to
  # install from a phone: releases/download/smsforwarder-latest/Halaa.apk
  publish-smsforwarder:
    name: Publish SmsForwarder APK
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: SmsForwarder-debug-apk
          path: apk

      - name: Replace the "smsforwarder-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/*.apk Halaa.apk
          cat > notes.md <<EOF
          גרסת בדיקה של "הלאה", נבנתה מ-${GITHUB_REF_NAME} (${GITHUB_SHA::7}).

          **התקנה:** פתחו את Halaa.apk בטלפון ואשרו התקנה ממקור לא ידוע.
          באנדרואיד 13 ומעלה, אם בקשת הרשאת ה-SMS לא מופיעה: הגדרות ← אפליקציות ← הלאה ← ⋮ ← "אפשר הגדרות מוגבלות".
          EOF
          gh release delete smsforwarder-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create smsforwarder-latest Halaa.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "הלאה (SmsForwarder) - קובץ התקנה" \
            --notes-file notes.md
